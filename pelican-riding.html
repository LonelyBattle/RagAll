<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · Pelican on a Bicycle</title>
<style>
  :root{
    --ink:#26303a;
    --panel:#ffffff;
    --paper:#eef3f8;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;
    background:
      radial-gradient(1200px 500px at 20% -10%, #dcecff 0%, transparent 60%),
      radial-gradient(1000px 500px at 110% 110%, #d8f0e3 0%, transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:"Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:26px 14px 40px;
  }
  h1{
    font-size:20px;font-weight:700;margin:0 0 2px;letter-spacing:.2px;
  }
  h1 .zh{color:#b33b2f}
  p.sub{margin:0 0 16px;font-size:13px;color:#5a6b7a;text-align:center;max-width:620px}
  .card{
    background:var(--panel);
    border:1px solid #d8e1ea;
    border-radius:18px;
    box-shadow:0 18px 40px -22px rgba(38,60,80,.45);
    padding:14px 14px 12px;
    width:min(920px, 100%);
  }
  svg#scene{
    width:100%;height:auto;display:block;
    border-radius:10px;
  }
  .controls{
    display:flex;align-items:center;gap:14px;
    padding:12px 6px 2px;flex-wrap:wrap;
  }
  .controls .btn{
    border:1px solid #c9d5e0;background:#fff;color:var(--ink);
    border-radius:999px;padding:7px 16px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.15s;
  }
  .controls .btn:hover{background:#f2f7fc;border-color:#a9bdcd}
  .controls .btn.primary{background:#2f6f44;color:#fff;border-color:#2f6f44}
  .controls .btn.primary:hover{background:#285f3a}
  .controls label{font-size:13px;color:#4a5a69;display:flex;align-items:center;gap:8px}
  .controls input[type=range]{width:190px;accent-color:#d3543f;cursor:pointer}
  .controls .val{font-variant-numeric:tabular-nums;min-width:34px;color:#3a4a59;font-weight:600}
  #err{color:#a52a2a;background:#ffe9e7;border:1px solid #f2b6ae;border-radius:10px;
       padding:8px 12px;font-size:12px;margin-top:10px;white-space:pre-wrap}
  .tip{font-size:12px;color:#7a8b99;margin-top:10px;text-align:center}
</style>
</head>
<body>
  <h1>鹈鹕 <span style="font-weight:400;color:#8a9a">·</span> 骑自行车 🚲</h1>
  <p class="sub">一只大嘴鹈鹕摇摇晃晃地蹬着自行车 —— SVG + 一点点 JavaScript 做腿部逆运动学，让双脚始终踩在脚踏上。</p>

  <div class="card">
    <svg id="scene" viewBox="0 0 900 640" role="img" aria-label="鹈鹕骑自行车的2D动画">
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7fd0ff"/>
          <stop offset=".62" stop-color="#cbeaff"/>
          <stop offset="1" stop-color="#eaf8ff"/>
        </linearGradient>
        <radialGradient id="sunGrad" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#fff3c2"/>
          <stop offset=".45" stop-color="#ffd94d"/>
          <stop offset="1" stop-color="#ffca2e"/>
        </radialGradient>
        <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8b939c"/>
          <stop offset=".18" stop-color="#6d757e"/>
          <stop offset="1" stop-color="#545b63"/>
        </linearGradient>
        <!-- 路边小物：灌木/小树/花丛/草丛，原点在贴地端 -->
        <g id="bushA"><path d="M0,0 C-16,-22 -12,-48 2,-52 C16,-50 22,-28 14,-8 C10,-3 4,0 0,0Z" fill="#5da24a" stroke="#3c6f32" stroke-width="2" stroke-linejoin="round"/>
          <path d="M-2,-30 C-10,-52 6,-60 14,-44" fill="none" stroke="#79c163" stroke-width="5" stroke-linecap="round"/></g>
        <g id="bushB"><path d="M0,0 C-20,-18 -22,-42 -6,-50 C-2,-52 6,-52 10,-46 C22,-42 24,-20 8,-4 C6,-2 2,0 0,0Z" fill="#4e9543" stroke="#35682e" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="2" cy="-62" r="7" fill="#86c96e"/><circle cx="-6" cy="-58" r="5" fill="#6fb558"/></g>
        <g id="tree"><rect x="-4" y="-34" width="8" height="34" rx="3" fill="#7a5233" stroke="#5c3d24" stroke-width="2"/>
          <circle cx="0" cy="-52" r="24" fill="#3f9b57" stroke="#2c703e" stroke-width="2"/><circle cx="-12" cy="-44" r="14" fill="#4fae67"/>
          <circle cx="12" cy="-62" r="13" fill="#4fae67"/></g>
        <g id="flowers"><circle cx="-8" cy="-8" r="6" fill="#f48fb1" stroke="#b25072" stroke-width="1.6"/>
          <circle cx="6" cy="-14" r="6" fill="#ffb347" stroke="#c47f2a" stroke-width="1.6"/>
          <circle cx="0" cy="-3" r="5" fill="#eae2d6"/></g>
        <g id="rock"><path d="M0,0 C-14,-4 -12,-18 -2,-20 C8,-21 14,-10 8,-2 C6,0 2,0 0,0Z" fill="#9aa3ac" stroke="#6f787f" stroke-width="2"/></g>
        <!-- 鹈鹕脚掌（蹼足，指向 +x，脚踝位于原点） -->
        <g id="footShape">
          <path id="footPath" d="M-13,-8 C-5,-13 9,-13 17,-9 C28,-4 28,4 17,9 C9,13 -5,13 -13,8 C-17,5 -17,-4 -13,-8 Z"/>
          <path d="M-4,-7 C4,-9 12,-8 18,-5 M-2,8 C5,9 12,8 16,6 M2,-2 C6,-2 12,-1 16,1" fill="none" stroke-width="1.8" opacity=".55" stroke-linecap="round"/>
        </g>
      </defs>

      <!-- 天空 -->
      <rect x="0" y="0" width="900" height="640" fill="url(#skyGrad)"/>

      <!-- 太阳 -->
      <g>
        <circle cx="122" cy="108" r="64" fill="#ffd95e" opacity=".16"/>
        <circle cx="122" cy="108" r="44" fill="url(#sunGrad)" stroke="#eab42a" stroke-width="2"/>
        <path d="M122,38 v-16 M122,178 v-14 M58,108 H44 M200,108 h-14 M76,62 l-10,-10 M170,152 l-9,-9 M168,62 l9,-9 M74,152 l9,-9"
          stroke="#ffd34d" stroke-width="5" stroke-linecap="round" opacity=".8"/>
      </g>

      <!-- 云（远处） -->
      <g id="clouds" fill="#ffffff">
        <g id="c0" opacity=".92"><ellipse cx="0" cy="0" rx="52" ry="17"/><ellipse cx="-30" cy="-10" rx="24" ry="13"/>
          <ellipse cx="34" cy="-7" rx="28" ry="13"/></g>
        <g id="c1" opacity=".8"><ellipse cx="0" cy="0" rx="40" ry="13"/><ellipse cx="-22" cy="-8" rx="18" ry="10"/>
          <ellipse cx="26" cy="-6" rx="22" ry="11"/></g>
        <g id="c2" opacity=".7"><ellipse cx="0" cy="0" rx="34" ry="11"/><ellipse cx="-16" cy="-6" rx="16" ry="9"/></g>
        <g id="c3" opacity=".85"><ellipse cx="0" cy="0" rx="46" ry="14"/><ellipse cx="-26" cy="-8" rx="20" ry="11"/>
          <ellipse cx="30" cy="-7" rx="24" ry="12"/></g>
      </g>

      <!-- 远处山丘 + 近处草地（由 JS 生成周期轮廓并横向滚动） -->
      <g id="farHills"><path id="farPath"/></g>
      <g id="nearField"><path id="fieldPath"/></g>

      <!-- 路旁灌木/小树 -->
      <g id="bushSlot"></g>

      <!-- 公路 -->
      <g>
        <rect x="-40" y="545" width="980" height="100" fill="url(#roadGrad)"/>
        <path d="M-40,545 H940" stroke="#f4f7fa" stroke-width="3" opacity=".9"/>
        <path d="M-40,545 H940" stroke="#5b646e" stroke-width="9" opacity=".5"/>
        <rect x="-40" y="620" width="980" height="25" fill="#4a515a" opacity=".5"/>
        <line id="roadDash" x1="-60" y1="598" x2="960" y2="598"
          stroke="#e9edf0" stroke-width="7" opacity=".85" stroke-linecap="round" stroke-dasharray="42 58"/>
      </g>

      <!-- 车轮（辐条由 JS 生成旋转组） -->
      <g id="wheelSlot"></g>

      <!-- 自行车 + 鹈鹕（下半身不摇，上半身轻微摇摆） -->
      <g id="rig">
        <!-- 车架 -->
        <g stroke="#ff6f52" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M238,460 398,450" stroke-width="10"/>                 <!-- 下后叉 -->
          <path d="M238,460 391,342" stroke-width="10"/>                 <!-- 上后叉 -->
          <path d="M398,450 391,342" stroke-width="12"/>                 <!-- 立管 -->
          <path d="M391,342 558,344" stroke-width="11"/>                 <!-- 上管 -->
          <path d="M398,450 560,408" stroke-width="12"/>                 <!-- 下管 -->
          <path d="M558,344 582,452" stroke-width="13"/>                 <!-- 头管 -->
          <path d="M582,452 612,460" stroke-width="8"/>                  <!-- 前叉 -->
          <path d="M398,450 391,342" stroke-width="12"/>
        </g>
        <!-- 座垫 -->
        <path d="M358,342 C362,330 384,328 398,331 C412,334 418,344 412,350 C398,352 356,352 352,348 C348,346 354,346 358,342Z"
          fill="#7a4f2d" stroke="#573a22" stroke-width="2"/>
        <!-- 链盘（牙盘） -->
        <circle cx="398" cy="450" r="30" fill="none" stroke="#39414b" stroke-width="7"/>
        <circle cx="398" cy="450" r="20" fill="none" stroke="#39414b" stroke-width="3" opacity=".55"/>
        <circle cx="398" cy="450" r="7" fill="#262c33"/>
        <!-- 曲柄（整组绕中轴旋转，由 JS 旋转） -->
        <g id="crankSpin" stroke="#262c33" stroke-linecap="round">
          <path id="armA" d="M398,450 L432,450" stroke-width="8"/>
          <path id="armB" d="M398,450 L364,450" stroke-width="8"/>
        </g>
        <!-- 脚踏板（两只，保持水平，JS 逐帧定位） -->
        <g id="pedals">
          <g id="pedalA"><rect x="-17" y="-5" width="34" height="9" rx="4" fill="#55606d" stroke="#2b3138" stroke-width="1.6"/>
            <circle cx="0" cy="0" r="3.2" fill="#23282e"/></g>
          <g id="pedalB"><rect x="-17" y="-5" width="34" height="9" rx="4" fill="#55606d" stroke="#2b3138" stroke-width="1.6"/>
            <circle cx="0" cy="0" r="3.2" fill="#23282e"/></g>
        </g>

        <!-- 远处腿（浅，较靠后） -->
        <g id="farLegLayer"></g>

        <!-- 车身（椭圆躯干）与后摆 -->
        <g id="rideSway">
          <g id="torsoG">
            <ellipse cx="398" cy="286" rx="58" ry="55" transform="rotate(-5 398 286)"
              fill="#fbf5e9" stroke="#3a2f26" stroke-width="3"/>
            <!-- 翅膀/羽毛暗示 -->
            <path d="M352,268 C372,258 400,262 420,280 M358,296 C376,288 398,290 416,306"
              fill="none" stroke="#e3ddca" stroke-width="7" stroke-linecap="round" opacity=".9"/>
            <path d="M398,286 m44,6 a48,42 0 0 1 -34,30" fill="none" stroke="#c9c2ac" stroke-width="3" stroke-dasharray="1 9" stroke-linecap="round" opacity=".8"/>
          </g>
        </g>

        <!-- 近处腿（深，靠前） -->
        <g id="nearLegLayer"></g>

        <!-- 颈部 + 头 + 巨喙 + 喉囊（由 headG 整体轻微摆动） -->
        <g id="headG">
          <!-- 颈部 -->
          <path d="M410,252 C414,236 421,222 429,206" fill="none" stroke="#f4ecdb" stroke-width="30" stroke-linecap="round"/>
          <!-- 头部 -->
          <circle cx="432" cy="195" r="21" fill="#fbf5e9" stroke="#3a2f26" stroke-width="3"/>
          <!-- 头后冠羽 -->
          <path d="M414,180 C410,170 418,164 426,168 M416,184 C414,176 422,170 430,174" fill="none" stroke="#e7e0c9" stroke-width="4" stroke-linecap="round"/>
          <!-- 眼睛 -->
          <circle cx="443" cy="190" r="3.4" fill="#22262b"/>
          <circle cx="444.3" cy="188.6" r="1.1" fill="#fff"/>
          <!-- 上喙 -->
          <path d="M450,187 C520,181 566,185 598,192 Q601,197 595,199 C558,197 516,201 450,201 Z"
            fill="#f2a72d" stroke="#3a2f26" stroke-width="3" stroke-linejoin="round"/>
          <!-- 喙尖小钩 -->
          <path d="M598,192 Q601,198 594,201 L598,197" fill="none" stroke="#c87a1d" stroke-width="2.6"/>
          <!-- 喉囊（下喙之间的皮囊，会轻微颤动） -->
          <g id="pouchG">
            <path d="M450,202 C466,252 514,266 553,238 C566,226 570,216 564,208 C546,207 496,204 450,202 Z"
              fill="#ffd181" stroke="#3a2f26" stroke-width="3" stroke-linejoin="round"/>
            <path d="M486,216 C488,236 498,248 512,252 M516,216 C518,234 528,246 540,246 M464,214 C466,228 474,240 486,246"
              fill="none" stroke="#e89c43" stroke-width="2" opacity=".6" stroke-linecap="round"/>
            <!-- 下喙细杆到喙尖 -->
            <path d="M560,224 C574,215 586,207 594,201" fill="none" stroke="#e9a028" stroke-width="5" stroke-linecap="round"/>
          </g>
        </g>

        <!-- 伸向车把的"翅膀手" -->
        <g id="armG">
          <path id="armStroke" d="M412,250 C434,258 448,270 456,290 C460,301 465,313 470,325" fill="none"
            stroke="#3a2f26" stroke-width="20" stroke-linecap="round"/>
          <path id="armFill" d="M412,250 C434,258 448,270 456,290 C460,301 465,313 470,325" fill="none"
            stroke="#f4ecdb" stroke-width="12" stroke-linecap="round"/>
          <circle cx="470" cy="326" r="7" fill="#262c33"/>
          <circle cx="469" cy="324.5" r="2" fill="#5a636d"/>
        </g>

        <!-- 围巾 -->
        <g id="scarfG">
          <path d="M398,248 C424,252 446,258 452,270 L446,280 C428,272 396,264 380,262 Z" fill="#e24a3f" stroke="#b8332b" stroke-width="1.6"/>
          <path id="tailFar" d="M398,254 C352,242 300,248 258,234 C232,226 206,228 184,234"
            fill="none" stroke="#e24a3f" stroke-width="9" stroke-linecap="round"/>
          <path id="tailNear" d="M392,262 C340,250 288,266 240,252 C212,244 184,244 158,252"
            fill="none" stroke="#d33f34" stroke-width="12" stroke-linecap="round"/>
        </g>

        <!-- 车把 -->
        <g fill="none" stroke="#ff6f52" stroke-linecap="round">
          <path d="M558,344 L536,318" stroke-width="11"/>                                        <!-- 立管 -->
          <path d="M536,318 C514,300 492,302 470,318 C466,321 463,325 463,330" stroke-width="12"/> <!-- 弯把 -->
        </g>
        <circle cx="463" cy="331" r="6" fill="#3a2f26"/>
      </g>
      <script>/* placeholder never runs - real script follows */</script>
    </svg>

    <div class="controls">
      <button id="playBtn" class="btn primary">⏸ 暂停</button>
      <label>踏频 <input type="range" id="speed" min="0" max="2" step="0.05" value="1"></label>
      <span class="val" id="speedVal">×1.0</span>
    </div>
    <div id="err" hidden></div>
    <p class="tip">提示：把上方滑杆拖到 ×0 会"刹停"；车轮辐条、道路虚线、灌木、云朵、山丘全部按视差速度联动。</p>
  </div>

<script>
(function(){
"use strict";
var errBox=document.getElementById("err");
function fail(e){ if(errBox){ errBox.hidden=false; errBox.textContent="出错了: "+(e&&e.stack||e); } }
try{ run(); }catch(e){ fail(e); window.onerror=function(m){ fail(new Error(m)); return true; }; }

function run(){
  var NS="http://www.w3.org/2000/svg";
  var svg=document.getElementById("scene");
  function S(tag,attrs){ var el=document.createElementNS(NS,tag); for(var k in attrs){ el.setAttribute(k,attrs[k]); } return el; }

  /* ---------- 常量 ---------- */
  var W=900;
  var HUB={rear:{x:238,y:460}, front:{x:612,y:460}};
  var R=85;                    // 轮半径
  var CRANK={x:398,y:450,r:34}; // 中轴
  var HIP={x:398,y:336};        // 髋/坐骨点
  var LA=80, LB=74;             // 大腿/小腿长
  var GEAR=3.0;                 // 每踏一圈，轮子转 1/GEAR
  var baseRevSec=0.8;           // 默认每秒踏多少圈

  /* ---------- 视差行：周期性小山 / 草地 ---------- */
  function rowPath(fn, x0, x1, step, baseBottom){
    var d="", y0=fn(x0); d="M"+x0.toFixed(1)+","+y0.toFixed(1);
    for(var x=x0+step; x<=x1; x+=step){ d+=" L"+x.toFixed(1)+","+fn(x).toFixed(1); }
    d+=" L"+x1+","+baseBottom+" L"+x0+","+baseBottom+" Z";
    return d;
  }
  function sil(base, waves){
    return function(x){
      var y=base, k=2*Math.PI/900;
      for(var i=0;i<waves.length;i++){ var w=waves[i]; y-=w[0]*Math.sin(k*w[1]*x+w[2]); }
      return y;
    };
  }
  var farY  = sil(550, [[70,1,1.7],[26,3,-0.6],[14,6,0.9]]);
  var fieldY= sil(556, [[48,2,-0.4],[22,5,1.9],[10,8,0.2]]);
  var farPath  =document.getElementById("farPath");
  var fieldPath=document.getElementById("fieldPath");
  farPath.setAttribute("fill","#c9e4b6");
  farPath.setAttribute("d", rowPath(farY,-60,1860,10,700));
  fieldPath.setAttribute("fill","#9ad07f");
  fieldPath.setAttribute("stroke","#7cb463"); fieldPath.setAttribute("stroke-width","3");
  fieldPath.setAttribute("d", rowPath(fieldY,-60,1860,10,700));

  /* ---------- 车轮 ---------- */
  var wheelSlot=document.getElementById("wheelSlot");
  var spins=[];
  function buildWheel(hx){
    var g=S("g",{transform:"translate("+hx+" "+HUB.rear.y+")"});
    g.appendChild(S("circle",{r:R+3, fill:"#23262c"}));                      // 轮胎外
    g.appendChild(S("circle",{r:R, fill:"#34383f"}));                        // 胎
    g.appendChild(S("circle",{r:R-3, fill:"#25292f", opacity:".9"}));        // 胎纹暗
    var spin=S("g");
    for(var i=0;i<9;i++){
      var a=Math.PI*2*i/9, x=Math.cos(a)*70, y=Math.sin(a)*70;
      spin.appendChild(S("line",{x1:0,y1:0,x2:x,y2:y,stroke:"#d6dce3","stroke-width":"2.4",opacity:".85"}));
    }
    spin.appendChild(S("circle",{cx:0,cy:-74,r:4.2,fill:"#f4c14f",stroke:"#b98a24","stroke-width":"1.4"})); // 气嘴
    g.appendChild(spin);
    g.appendChild(S("circle",{r:76,fill:"none",stroke:"#e2e8ee","stroke-width":"5"}));   // 轮圈
    g.appendChild(S("circle",{r:68,fill:"none",stroke:"#c6cdd6","stroke-width":"1.4",opacity:".7"}));
    g.appendChild(S("circle",{r:9,fill:"#88919b",stroke:"#5c646d","stroke-width":"2"})); // 花鼓
    g.appendChild(S("circle",{r:3.4,fill:"#434a52"}));
    wheelSlot.appendChild(g);
    return spin;
  }
  var spinRear=buildWheel(HUB.rear.x);
  var spinFront=buildWheel(HUB.front.x);

  /* ---------- 路旁灌木 ---------- */
  var defs=document.querySelector("#scene defs");
  var TYPES=["bushA","bushB","bushA","tree","flowers","bushB","rock","bushA","tree","flowers"];
  var worldSpan=2000, bushs=[];
  (function(){
    for(var i=0;i<40;i++){
      var wX=(i*207+((i*i*53)%71)+40)%worldSpan;
      var type=TYPES[i%TYPES.length];
      bushs.push({x:wX, y:545, u:S("use",{"href":"#"+type})});
    }
    bushs.sort(function(a,b){return a.x-b.x;});
    var sh=document.getElementById("bushSlot");
    bushs.forEach(function(b){ sh.appendChild(b.u); });
  })();

  /* ---------- 云 ---------- */
  var clouds=[];
  [["c0",140,90],["c1",420,58],["c2",760,120],["c3",590,170]].forEach(function(o,i){
    var el=document.getElementById(o[0]);
    el.setAttribute("transform","translate("+o[1]+" "+o[2]+")");
    clouds.push({el:el,x:o[1],y:o[2],sp:2.6+i*0.9});
  });

  /* ---------- 腿部 DOM：远腿与近腿，各由 大腿+小腿(双描边) 组成 ---------- */
  function limb(parent, color, outline, wOut,wIn){
    var out=function(){ return S("path",{fill:"none",stroke:outline,"stroke-linecap":"round","stroke-linejoin":"round"}); };
    var a={o:out(),i:out(),wOut:wOut,wIn:wIn};
    a.o.setAttribute("stroke-width",wOut); a.i.setAttribute("stroke-width",wIn); a.i.setAttribute("stroke",color);
    parent.appendChild(a.o); parent.appendChild(a.i);
    return a;
  }
  function setLimbSeg(seg,p1,p2){
    var d="M"+p1.x.toFixed(1)+","+p1.y.toFixed(1)+" L"+p2.x.toFixed(1)+","+p2.y.toFixed(1);
    seg.o.setAttribute("d",d); seg.i.setAttribute("d",d);
  }
  var farLayer=document.getElementById("farLegLayer");
  var nearLayer=document.getElementById("nearLegLayer");
  var legFarT=limb(farLayer,"#f4bd7e","#4a3527",24,16);
  var legFarS=limb(farLayer,"#efb06a","#4a3527",18,12);
  var farFoot=S("use",{"href":"#footShape","fill":"#f9b876","stroke":"#4a3527","stroke-width":"3","stroke-linejoin":"round"});
  farLayer.appendChild(farFoot);
  var legNearT=limb(nearLayer,"#ff9a3d","#3a2f26",25,17);
  var legNearS=limb(nearLayer,"#f58f2e","#3a2f26",19,13);
  var nearFoot=S("use",{"href":"#footShape","fill":"#ff9a3d","stroke":"#3a2f26","stroke-width":"3","stroke-linejoin":"round"});
  nearLayer.appendChild(nearFoot);
  farLayer.setAttribute("opacity",".92");
  nearLayer.setAttribute("transform","translate(0 0)");

  /* 逆运动学：髋->脚，两节腿求膝 */
  function solve(H,F){
    var dx=F.x-H.x, dy=F.y-H.y;
    var d=Math.sqrt(dx*dx+dy*dy);
    d=Math.max(Math.abs(LA-LB),Math.min(LA+LB-0.01,d));
    var ux=dx/d, uy=dy/d;
    var ang=Math.atan2(dy,dx);
    var c=Math.max(-1,Math.min(1,(LA*LA+d*d-LB*LB)/(2*LA*d)));
    var th=Math.acos(c);
    var kneeAng=ang-th;             // 膝盖向骑行方向(前)弯
    var K={x:H.x+Math.cos(kneeAng)*LA, y:H.y+Math.sin(kneeAng)*LA};
    return K;
  }

  /* ---------- 状态 ---------- */
  var paused=false, speed=1.0;
  var theta=Math.PI/2;       // 起始：近脚在底
  var wheelRad=0, groundD=0, swing=0;

  var playBtn=document.getElementById("playBtn");
  var speedEl=document.getElementById("speed");
  var speedVal=document.getElementById("speedVal");
  speedEl.addEventListener("input",function(){ speed=parseFloat(speedEl.value); speedVal.textContent="×"+speed.toFixed(1); });
  playBtn.addEventListener("click",function(){ paused=!paused; playBtn.textContent=paused?"▶ 播放":"⏸ 暂停"; playBtn.classList.toggle("primary",!paused); });

  /* 视觉错位：让近腿在深色、远腿在浅色之外更有层次 */
  var pedalA=document.getElementById("pedalA");
  var pedalB=document.getElementById("pedalB");
  var crankSpin=document.getElementById("crankSpin");
  var armStroke=document.getElementById("armStroke"), armFill=document.getElementById("armFill");
  var rideSway=document.getElementById("rideSway");
  var headG=document.getElementById("headG");
  var pouchG=document.getElementById("pouchG");
  var scarfG=document.getElementById("scarfG");

  /* ---------- 推进 + 绘制拆开（便于 ?t= 探针同步验证） ---------- */
  var dt=0.016, last=performance.now();
  function advance(){
    var dTheta=baseRevSec*speed*2*Math.PI*dt;   // 顺时针踏 → 车向右
    theta+=dTheta;
    var dWheel=dTheta/GEAR;
    wheelRad+=dWheel;
    groundD+=dWheel*R;
    swing=Math.sin(theta*2);
  }
  function paint(){
    /* 车轮辐条 */
    var wheelDeg=(wheelRad*180/Math.PI)%360;
    spinRear.setAttribute("transform","rotate("+wheelDeg.toFixed(1)+")");
    spinFront.setAttribute("transform","rotate("+wheelDeg.toFixed(1)+")");

    /* 曲柄旋转（顺脚方向） */
    crankSpin.setAttribute("transform","rotate("+((theta*180/Math.PI)%360).toFixed(1)+" "+CRANK.x+" "+CRANK.y+")");

    /* 脚踏位置与腿部 */
    var ct=Math.cos(theta), st=Math.sin(theta);
    var Fn={x:CRANK.x+CRANK.r*ct, y:CRANK.y+CRANK.r*st};   // 近脚
    var Ff={x:CRANK.x-CRANK.r*ct, y:CRANK.y-CRANK.r*st};   // 远脚
    var Kn=solve(HIP,Fn), Kf=solve(HIP,Ff);

    setLimbSeg(legNearT,HIP,Kn); setLimbSeg(legNearS,Kn,Fn);
    setLimbSeg(legFarT,HIP,Kf);  setLimbSeg(legFarS,Kf,Ff);

    nearFoot.setAttribute("transform","translate("+Fn.x.toFixed(1)+" "+(Fn.y-3).toFixed(1)+")");
    farFoot.setAttribute("transform","translate("+Ff.x.toFixed(1)+" "+(Ff.y-3).toFixed(1)+")");
    pedalA.setAttribute("transform","translate("+Fn.x.toFixed(1)+" "+(Fn.y+7).toFixed(1)+")");
    pedalB.setAttribute("transform","translate("+Ff.x.toFixed(1)+" "+(Ff.y+7).toFixed(1)+")");

    /* 上半身轻微摇摆 + 头颈晃动 + 喉囊颤动 */
    var swayDeg=1.1*Math.sin(-theta*2-1.2);
    var headDeg=1.6*Math.sin(-theta*2+0.6)+0.6*Math.sin(-theta+2.2);
    var pouchDeg=2.4*Math.sin(-theta*2+2.4);
    rideSway.setAttribute("transform","rotate("+swayDeg.toFixed(2)+" 398 334)");
    headG.setAttribute("transform","rotate("+headDeg.toFixed(2)+" 410 250)");
    pouchG.setAttribute("transform","rotate("+pouchDeg.toFixed(2)+" 448 205)");

    /* 围巾飘动（幅度随踏频） */
    var amp=speed*(paused?0.4:1);
    scarfG.setAttribute("transform","rotate("+(6*amp*Math.sin(-theta*2+1.1)).toFixed(2)+" 400 252)");

    /* 道路虚线（正偏移 → 虚线向左，随路面后退） */
    document.getElementById("roadDash").setAttribute("stroke-dashoffset",(groundD).toFixed(1));

    /* 路旁灌木（世界坐标 - 已走距离，向左滚动） */
    bushs.forEach(function(b){
      var sx=((b.x-groundD)%worldSpan+worldSpan)%worldSpan;
      if(sx>-60 && sx<1030){
        b.u.setAttribute("transform","translate("+sx.toFixed(1)+" "+b.y+")");
      } else { b.u.setAttribute("transform","translate(-300 -300)"); }
    });

    /* 山丘与草地视差 */
    var fOff=((groundD*0.5)%900+900)%900;
    var nOff=((groundD*0.16)%900+900)%900;
    farPath.parentNode.setAttribute("transform","translate("+(-fOff).toFixed(1)+" 0)");
    fieldPath.parentNode.setAttribute("transform","translate("+(-nOff).toFixed(1)+" 0)");

    /* 云 */
    clouds.forEach(function(c){
      c.x-= (3+c.sp)*(speed>0?0.25+speed*0.25:0.1)*dt*10*0.6;
      if(c.x<-140)c.x=980;
      c.el.setAttribute("transform","translate("+c.x.toFixed(1)+" "+c.y+")");
    });
  }
  function frame(now){
    var ndt=Math.min(0.05,(now-last)/1000); last=now;
    if(ndt>0){ dt=ndt; }
    if(!paused && speed>0){ advance(); }
    paint();
    requestAnimationFrame(frame);
  }

  /* 测试/截图探针： ?t=秒 → 同步推进到该时刻并停留（真实浏览器正常走 rAF） */
  var probe=parseFloat((location.search.match(/[?&]t=([\d.]+)/)||[])[1]);
  if(!isNaN(probe)&&probe>=0){
    paused=true; speed=1;
    playBtn.textContent="▶ 播放"; playBtn.classList.remove("primary");
    var steps=Math.round(probe*60);
    for(var si=0;si<steps;si++){ dt=1/60; advance(); }
    dt=1/60; paint();
  }
  requestAnimationFrame(frame);
}
})();
</script>
</body>
</html>
